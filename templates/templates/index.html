<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LexiCode AI - Instant Code Documentation</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-6">
    <div class="max-w-4xl w-full bg-slate-900 border border-slate-800 rounded-2xl shadow-xl p-8">
        <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-500 mb-2">LexiCode AI</h1>
        <p class="text-slate-400 mb-6">Transform messy code snippets into crystal-clear documentation instantly.</p>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Input Area -->
            <div class="flex flex-col">
                <label class="text-sm font-semibold text-slate-300 mb-2">Paste your code snippet:</label>
                <textarea id="codeInput" rows="12" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-sm font-mono text-slate-200 focus:outline-none focus:border-blue-500" placeholder="def hello_world():&#10;    print('Hello, World!')"></textarea>
                <button onclick="generateDocs()" id="generateBtn" class="mt-4 bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl transition duration-200 shadow-lg shadow-blue-600/30">Generate Documentation</button>
            </div>
            
            <!-- Output Area -->
            <div class="flex flex-col">
                <label class="text-sm font-semibold text-slate-300 mb-2">Generated Documentation:</label>
                <div id="outputArea" class="w-full h-[312px] bg-slate-950 border border-slate-800 rounded-xl p-4 text-sm text-slate-300 overflow-y-auto whitespace-pre-wrap font-sans">Your AI-generated documentation will appear here...</div>
            </div>
        </div>
    </div>

    <script>
        async function generateDocs() {
            const code = document.getElementById('codeInput').value;
            const outputArea = document.getElementById('outputArea');
            const btn = document.getElementById('generateBtn');

            if (!code.trim()) {
                alert('Please enter some code first!');
                return;
            }

            outputArea.innerText = 'Analyzing code and generating documentation... ⏳';
            btn.disabled = true;

            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: code })
                });
                const data = await response.json();
                if (response.ok) {
                    outputArea.innerText = data.documentation;
                } else {
                    outputArea.innerText = 'Error: ' + data.error;
                }
            } catch (err) {
                outputArea.innerText = 'An error occurred while connecting to the server.';
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
